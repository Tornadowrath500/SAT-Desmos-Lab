<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Desmos Studio</title>
<meta name="description" content="Learn to use Desmos on the digital SAT: interactive lessons, shortcuts, practice, and a live calculator. Free, no login.">
<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=4435f284d2154cf48e80abbbffc842cd"></script>
<script>window.Desmos||document.write('<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"><\/script>')</script>
<style>
:root{--hd:#212121;--blue:#004D96;--blue2:#00366D;--bg:#F4F5F6;--bd:#C1C6C8;--tx:#1C1C1C;--mu:#595959;--ok:#188038;--bad:#c5221f;--card:#fff;--pb:#e8f0fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}
header{height:52px;background:var(--hd);color:#fff;display:flex;align-items:center;gap:20px;padding:0 18px}
header b{font-weight:600;letter-spacing:.3px}
header .sp{flex:1}
.mode button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 12px;border-radius:6px}
.mode button[aria-pressed=true]{background:#fff;color:var(--hd)}
#streak{font-size:13px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px}
#app{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:calc(100vh - 52px)}
#side{display:flex;flex-direction:column;min-height:0;background:var(--card);border-right:1px solid var(--bd)}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;color:var(--mu);font-weight:600}
.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--blue)}
.pane{flex:1;overflow:auto;padding:18px;display:none}
.pane.on{display:block}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.lesson{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx)}
.lesson:hover{border-color:var(--blue)}
.lesson small{color:var(--mu);display:block}
.pill{font-size:12px;font-weight:600;color:var(--blue);background:var(--pb);padding:2px 9px;border-radius:12px;white-space:nowrap}
.pill.d{color:var(--ok);background:#e6f4ea}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600}
.btn:hover{background:var(--blue2)}
.btn.g{background:var(--card);color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.step{display:flex;gap:10px;padding:10px 0;border-top:1px solid #e3e5e7;opacity:.55}
.step.cur{opacity:1}
.step.done{opacity:1}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bd);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.cur .n{border-color:var(--blue);color:var(--blue)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step .t{font-weight:600}
.step .d{color:var(--mu);font-size:14px}
.ask{display:flex;gap:6px;margin-top:8px}
input[type=text],input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;min-width:0;flex:1;background:var(--card);color:var(--tx)}
input:focus{outline:2px solid rgba(0,77,150,.35)}
.fb{font-size:13px;min-height:1.2em;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
kbd{font:600 13px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 7px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e3e5e7}
.sc .d{color:var(--mu);font-size:13px}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 0 0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--pb);color:var(--blue)}
.q{font-size:17px;margin:10px 0}
.hint{font-size:14px;color:var(--mu);border-left:3px solid var(--bd);padding-left:10px;margin-top:10px}
#calcWrap{position:relative;min-height:0}
#calc,#sat{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#sat{display:none}
body.sat #calc{visibility:hidden}
body.sat #sat{display:block}
body.sat #side{display:none}
body.sat #app{grid-template-columns:1fr}
#tb{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:6px}
#tb .btn{box-shadow:0 2px 6px rgba(0,0,0,.2)}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 60vh;height:auto;min-height:calc(100vh - 52px)}#side{border-right:0;border-bottom:1px solid var(--bd);max-height:75vh}#calcWrap{height:60vh}}
select{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);margin-bottom:12px}
#dk,.hb{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 10px;border-radius:6px}
#warn{background:#fdecea;color:#8a1c14;padding:8px 18px;font-size:14px}
body.dark{--bg:#0f1318;--card:#171c23;--tx:#e8eaed;--mu:#9aa0a6;--bd:#2b323c;--blue:#6fa8f0;--blue2:#8ab8f5;--pb:#25354a}
body.dark .btn:not(.g){color:#0b1b2e}
header{border-bottom:1px solid rgba(255,255,255,.08)}
header b::before{content:"SAT";background:#fff;color:var(--hd);font-size:11px;padding:2px 6px;border-radius:4px;margin-right:8px;font-weight:800}
#side{box-shadow:2px 0 12px rgba(0,0,0,.08)}
.pane{padding:20px 20px 40px;scrollbar-width:thin}
.card{border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px 16px}
.btn{border-radius:8px;transition:background .15s,transform .05s}.btn:active{transform:scale(.97)}
.btn.g:hover{background:var(--pb)}
.bar{height:6px;border-radius:3px;background:var(--bd);margin:8px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.sol{margin:12px 0 0;padding-left:20px;font-size:14px}.sol li{margin:6px 0}
.acc{font-size:12px;color:var(--mu);margin-left:6px}
.step.done:not(.cur) .t{color:var(--mu)}
.tabs button:hover{background:var(--pb)}
#calc,#sat{background:var(--card)}
#dk{margin-left:0}.hb[aria-pressed=true]{background:#fff;color:var(--hd)}
.tabs button{font-size:14px}
.pop{position:fixed;z-index:50;min-width:300px;min-height:260px;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.45);overflow:hidden;resize:both;display:flex;flex-direction:column;max-width:98vw;max-height:96vh}
.pop[hidden]{display:none}.pop.mini{height:38px!important;min-height:0;resize:none}
.ph{height:38px;flex:none;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;cursor:grab;touch-action:none;user-select:none}
.ph button{background:none;border:0;color:#fff;font-size:18px;width:30px;height:28px;border-radius:6px}.ph button:hover{background:rgba(255,255,255,.18)}
.pb{flex:1;min-height:0;overflow:auto}.pb iframe{width:100%;height:calc(100% - 12px);border:0;display:block;background:#fff}
.drag iframe{pointer-events:none}
.ref{margin:0;padding:12px 16px 20px;list-style:none;font-size:14px}.ref li{padding:7px 0;border-bottom:1px solid var(--bd)}.ref b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-top:10px;border:0}
@media(max-width:820px){.pop{left:0!important;right:0!important;top:auto!important;bottom:0;width:100%!important;height:72vh!important;resize:none;border-radius:12px 12px 0 0}}
</style>
</head>
<body class="dark">
<header>
  <b>SAT Desmos Studio</b>
  <span id="streak">Solved: 0</span>
  <span class="sp"></span>
  <button class="hb" id="bc" aria-pressed="false" title="Alt + C">🧮 Calculator</button>
  <button class="hb" id="br" aria-pressed="false">Reference</button>
  <button id="dk">☾ Dark</button>
  <div class="mode" role="group" aria-label="Calculator mode">
    <button id="mWork" aria-pressed="true">Study workspace</button>
    <button id="mSat" aria-pressed="false">Official (full screen)</button>
  </div>
</header>
<div id="app">
  <aside id="side">
    <div class="tabs" role="tablist">
      <button data-p="learn" aria-selected="true">Learn</button>
      <button data-p="keys" aria-selected="false">Shortcuts</button>
      <button data-p="prac" aria-selected="false">Practice</button>
      <button data-p="mast" aria-selected="false">Mastery</button>
    </div>
    <section class="pane on" id="p-learn"></section>
    <section class="pane" id="p-keys"></section>
    <section class="pane" id="p-prac"></section>
    <section class="pane" id="p-mast"></section>
  </aside>
  <div id="calcWrap">
    <div id="calc"></div>
    <iframe id="sat" title="Official SAT Desmos calculator" src="about:blank" allow="clipboard-write"></iframe>
    <div id="tb"><button class="btn g" id="clr">Clear graph</button></div>
  </div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[ri(0,a.length-1)];
const store={get:()=>{try{return JSON.parse(localStorage.getItem('satdesmos'))||{}}catch(e){return{}}},set:o=>{try{localStorage.setItem('satdesmos',JSON.stringify(o))}catch(e){}}};
let S=store.get(); S.done=S.done||{}; S.solved=S.solved||0;
const save=()=>store.set(S);

/* Calculator (SAT-style: keypad, no extras) */
const HAS=typeof Desmos!=='undefined';const noop=()=>{};let calc;
try{calc=Desmos.GraphingCalculator($('#calc'),{keypad:true,settingsMenu:true,expressionsTopbar:true,zoomButtons:true,pointsOfInterest:true,trace:true,border:false,lockViewport:false})}catch(e){calc={setBlank:noop,setExpressions:noop,setExpression:noop,setMathBounds:noop,getExpressions:()=>[],observeEvent:noop,resize:noop,updateSettings:noop}}
const exprs=()=>calc.getExpressions();
const latexes=()=>exprs().filter(e=>e.type==='expression').map(e=>(e.latex||'').replace(/\s|\\left|\\right/g,''));
const hasTable=()=>exprs().some(e=>e.type==='table');
function load(list,view){calc.setBlank();calc.setExpressions(list.map((e,i)=>typeof e==='string'?{id:'e'+i,latex:e}:e));calc.setMathBounds(fit(view||{left:-15,right:15,bottom:-15,top:15}))}
function fit(v){try{const g=calc.graphpaperBounds.pixelCoordinates,w=g.right-g.left,h=g.bottom-g.top;if(!(w>0&&h>0))return v;const k=Math.max((v.right-v.left)/w,(v.top-v.bottom)/h),cx=(v.left+v.right)/2,cy=(v.bottom+v.top)/2;return{left:cx-k*w/2,right:cx+k*w/2,bottom:cy-k*h/2,top:cy+k*h/2}}catch(e){return v}}
$('#clr').onclick=()=>calc.setBlank();

/* Mode toggle: study workspace vs the official College Board embed */
function mode(sat){document.body.classList.toggle('sat',sat);$('#mSat').setAttribute('aria-pressed',sat);$('#mWork').setAttribute('aria-pressed',!sat);$('#tb').style.display=sat?'none':'flex';
 if(sat&&$('#sat').src==='about:blank')$('#sat').src='https://www.desmos.com/testing/collegeboard/graphing';if(!sat)calc.resize();}
$('#mSat').onclick=()=>mode(true);$('#mWork').onclick=()=>mode(false);

/* Tabs */
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p))});

/* ---------- LEARN ---------- */
const pts=[[1,3.2],[2,4.9],[3,7.1],[4,9.2],[5,10.8],[6,13.1]];
const n=pts.length,sx=pts.reduce((a,p)=>a+p[0],0),sy=pts.reduce((a,p)=>a+p[1],0),sxy=pts.reduce((a,p)=>a+p[0]*p[1],0),sxx=pts.reduce((a,p)=>a+p[0]*p[0],0);
const M=(n*sxy-sx*sy)/(n*sxx-sx*sx),B=(sy-M*sx)/n;
const tbl={type:'table',id:'t',columns:[{latex:'x_1',values:pts.map(p=>''+p[0])},{latex:'y_1',values:pts.map(p=>''+p[1])}]};
const LESSONS=[
{id:'reg',t:'Regression',s:'Fit a line to data in seconds',steps:[
 {t:'Load the data',d:'A table of data points is on the graph. Tap Load data, then look at the points.',set:()=>load([tbl],{left:-1,right:9,bottom:-2,top:16}),btn:'Load data',check:()=>hasTable()},
 {t:'Run a regression',d:'Click a new expression line and type <kbd>y_1~mx_1+b</kbd> (the <kbd>~</kbd> key is next to 1). Desmos fits the line for you.',check:()=>latexes().some(l=>/\\sim/.test(l))},
 {t:'Read the slope',d:'What is m, rounded to the nearest tenth? Look in the regression box under your equation.',ask:{a:M,tol:.06}},
 {t:'Make a prediction',d:'Use your line to predict y when x = 10. Type 10 into your formula or just compute it.',ask:{a:M*10+B,tol:.3}}]},
{id:'sys',t:'Systems of equations',s:'The intersection is the answer',steps:[
 {t:'Graph both lines',d:'Load the two equations.',set:()=>load(['y=2x+1','y=-x+7'],{left:-3,right:9,bottom:-3,top:10}),btn:'Load system',check:()=>latexes().length>=2},
 {t:'Find the intersection',d:'Tap the dot where the lines cross. What is the x-coordinate?',ask:{a:2}},
 {t:'Check the y-value',d:'What is the y-coordinate of the solution?',ask:{a:5}}]},
{id:'quad',t:'Quadratics',s:'Roots and vertex without algebra',steps:[
 {t:'Graph the parabola',d:'Load y = x² − 2x − 8.',set:()=>load(['y=x^2-2x-8'],{left:-6,right:8,bottom:-12,top:8}),btn:'Load parabola',check:()=>latexes().length>=1},
 {t:'Tap the x-intercepts',d:'What is the positive solution of x² − 2x − 8 = 0?',ask:{a:4}},
 {t:'Tap the vertex',d:'What is the minimum value of y?',ask:{a:-9}}]},
{id:'ineq',t:'Inequalities',s:'Shaded regions and test points',steps:[
 {t:'Graph the region',d:'Load two inequalities. The overlap of the shading is the solution set.',set:()=>load(['y>2x-3','y<-x+6'],{left:-4,right:8,bottom:-6,top:8}),btn:'Load inequalities',check:()=>latexes().length>=2},
 {t:'Find the corner',d:'The boundary lines meet at a corner. What is its x-coordinate?',ask:{a:3}},
 {t:'Test a point',d:'Type the point (2,3) in a new line. Is it inside the overlapping shaded region? Enter 1 for yes, 0 for no.',ask:{a:1}}]},
{id:'circ',t:'Circles',s:'Center and radius from the equation',steps:[
 {t:'Graph the circle',d:'Load (x − 2)² + (y + 1)² = 25.',set:()=>load(['(x-2)^2+(y+1)^2=25'],{left:-9,right:13,bottom:-9,top:9}),btn:'Load circle',check:()=>latexes().length>=1},
 {t:'Read the radius',d:'How long is the radius? Use the graph, or take the square root of 25.',ask:{a:5}},
 {t:'Read the center',d:'What is the y-coordinate of the center? Watch the sign.',ask:{a:-1}}]},
{id:'stat',t:'Statistics',s:'Mean, median, standard deviation',steps:[{t:'Enter a list',d:'Type <kbd>L=[4,8,15,16,23,42]</kbd> on a new line.',check:()=>latexes().some(l=>/^L=\[/.test(l))},{t:'Find the mean',d:'Type <kbd>mean(L)</kbd>. What is the result?',ask:{a:18}},{t:'Find the median',d:'Type <kbd>median(L)</kbd>. What is the result?',ask:{a:15.5}}]},
{id:'sld',t:'Sliders',s:'Explore how m and b change a line',steps:[
 {t:'Type a slider equation',d:'Type <kbd>y=mx+b</kbd>. Desmos offers to add sliders. Click All.',check:()=>latexes().some(l=>/^y=mx\+b/.test(l)||/^y=m\*?x\+b/.test(l))},
 {t:'Match a target',d:'Type the points (0,3) and (2,7), then drag the sliders until the line passes through both. What is m?',ask:{a:2}}]}
];
let cur=null,stepI=0;
const fb=(m,ok)=>{const f=$('#fb');if(f){f.textContent=m;f.className='fb '+(ok?'ok':'no')}};
function lessonList(){cur=null;const p=$('#p-learn');
 p.innerHTML='<h2>Interactive lessons</h2><div class="bar"><i style="width:'+Math.round(LESSONS.reduce((a,l)=>a+Math.min(S.done[l.id]||0,l.steps.length),0)*100/LESSONS.reduce((a,l)=>a+l.steps.length,0))+'%"></i></div><p class="sub">Pick a lesson. Each step loads the graph for you and checks your work as you go.</p>'+
 LESSONS.map((l,i)=>{const d=S.done[l.id]||0,tot=l.steps.length;return `<button class="card lesson" data-i="${i}"><span><b>${l.t}</b><small>${l.s}</small></span><span class="pill ${d>=tot?'d':''}">${d>=tot?'Done':d+'/'+tot}</span></button>`}).join('')+'<div class="row"><button class="btn g" id="rst">Reset progress</button></div>';
 $('#rst').onclick=()=>{if(confirm('Reset all lesson progress?')){S.done={};save();lessonList()}};$$('.lesson',p).forEach(b=>b.onclick=()=>openLesson(+b.dataset.i));}
function openLesson(i){cur=LESSONS[i];stepI=Math.min(S.done[cur.id]||0,cur.steps.length-1);if(S.done[cur.id]>=cur.steps.length)stepI=0;calc.setBlank();render();runSet();}
function go(i){stepI=Math.max(0,Math.min(cur.steps.length-1,i));render();runSet()}
function runSet(){const s=cur.steps[stepI];if(s.set&&!s.btn)s.set();}
function render(){const p=$('#p-learn'),done=S.done[cur.id]||0;
 p.innerHTML=`<button class="btn g" id="back">← All lessons</button><h2 style="margin-top:14px">${cur.t}</h2><p class="sub">Step ${Math.min(stepI+1,cur.steps.length)} of ${cur.steps.length}</p>`+
 cur.steps.map((s,i)=>`<div class="step ${i<done?'done':''} ${i===stepI?'cur':''}" data-i="${i}"><div class="n">${i<done?'✓':i+1}</div><div><div class="t">${s.t}</div>${i===stepI?`<div class="d">${s.d}</div>${s.btn?`<div class="row"><button class="btn" id="go">${s.btn}</button></div>`:''}${s.ask?'<div class="ask"><input type="text" id="ans" inputmode="decimal" placeholder="Your answer"><button class="btn" id="chk">Check</button></div>':''}<div class="fb" id="fb"></div><div class="row"><button class="btn g" id="bk" ${stepI?'':'disabled'}>← Back</button><button class="btn g" id="nx" ${stepI>=cur.steps.length-1?'disabled':''}>${stepI<done?'Next →':'Skip step'}</button></div>`:''}</div></div>`).join('')+
 (done>=cur.steps.length?'<div class="card" style="margin-top:12px"><b>Lesson complete.</b> Try the Practice tab next.</div>':'');
 $('#back').onclick=lessonList;
 $$('.step',p).forEach(e=>{const i=+e.dataset.i;if(i<=done&&i!==stepI){e.style.cursor='pointer';e.title='Go back to this step';e.onclick=()=>go(i)}});$('#bk').onclick=()=>go(stepI-1);$('#nx').onclick=()=>go(stepI+1);
 const g=$('#go');if(g)g.onclick=()=>{cur.steps[stepI].set();g.textContent='Loaded ✓';if(cur.steps[stepI].check&&!cur.steps[stepI].ask)setTimeout(poll,150)};
 const c=$('#chk');if(c){const f=()=>{const v=parseFloat($('#ans').value.replace('−','-')),a=cur.steps[stepI].ask;if(Math.abs(v-a.a)<=(a.tol||.01))advance();else fb('Not quite. Check the graph and try again.',false)};c.onclick=f;$('#ans').onkeydown=e=>{if(e.key==='Enter')f()}}}
function advance(){fb('Correct!',true);S.done[cur.id]=Math.max(S.done[cur.id]||0,stepI+1);save();stepI++;setTimeout(()=>{if(stepI>=cur.steps.length){stepI=cur.steps.length-1;confetti()}render();if(S.done[cur.id]<cur.steps.length)runSet()},650)}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d'),P=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,c:`hsl(${Math.random()*360},80%,55%)`,r:Math.random()*6+3}));let t=0;(function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r)});if(++t<90)requestAnimationFrame(f);else c.remove()})()}
function poll(){if(!cur)return;const s=cur.steps[stepI];if(s&&s.check&&!s.ask&&(S.done[cur.id]||0)===stepI&&s.check())advance()}
calc.observeEvent('change',()=>setTimeout(poll,100));
lessonList();

/* ---------- SHORTCUTS ---------- */
const KEYS=[
